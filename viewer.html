<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plant growth — prototype</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#11090d; color:#FFF8FA;
              font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  canvas { display:block; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
        background:linear-gradient(to top,rgba(17,9,13,.92),rgba(17,9,13,0)); }
  #row { display:flex; align-items:center; gap:12px; max-width:560px; margin:0 auto; }
  #scrub { flex:1; accent-color:#B92725; }
  button { background:#FFF8FA; color:#34262E; border:0; border-radius:999px;
           padding:9px 16px; font-weight:600; font-size:14px; }
  button:disabled { opacity:.4; }
  #hud { position:fixed; top:0; left:0; padding:12px 16px calc(12px + env(safe-area-inset-top));
         font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #hud b { font-size:20px; }
  #err { position:fixed; inset:0; display:none; place-content:center; padding:32px;
         text-align:center; background:#11090d; }
</style>
</head>
<body>
<div id="hud"><b id="frameNo">—</b> <span id="frameName"></span><br><span id="hgt"></span></div>
<div id="ui"><div id="row">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="0" step="1" value="0">
  <button id="arbtn" hidden>AR</button>
</div></div>
<div id="err"><div><h2>Could not load</h2><p id="errmsg"></p>
<p style="opacity:.7">Serve this folder over HTTP — opening the file directly blocks the .glb fetch.<br>
<code>python3 -m http.server 8000</code></p></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ARButton }      from 'three/addons/webxr/ARButton.js';

// ?model=plant_growth_full.glb to view a different build
const MODEL = new URLSearchParams(location.search).get('model') || 'plant_growth_full.min.glb';
const FPS   = 8;                      // growth steps per second
const CROSSFADE = 0;                  // 0 = hard cut; see ar.html for why

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x443355, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(0.4, 1, 0.6);
scene.add(key);

// The plant is only a few centimetres tall, so everything lives under a group
// we can scale up for viewing without touching the real-world metre units.
const group = new THREE.Group();
scene.add(group);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let frames = [], cur = 0, prev = -1, playing = true, acc = 0, fade = 0, meta = null;

// Geometry is Draco-compressed (5.8 MB -> 0.8 MB, surface area unchanged to
// within 0.02%). The decoder is served locally from ./draco/ so the page has no
// runtime dependency on a CDN.
function makeLoader() {
  const draco = new DRACOLoader().setDecoderPath('./draco/');
  return new GLTFLoader().setDRACOLoader(draco);
}

const $ = id => document.getElementById(id);

makeLoader().load(MODEL, gltf => {
  meta = gltf.parser.json.extras || {};
  // One mesh per growth step, in file order.
  gltf.scene.traverse(o => { if (o.isMesh) frames.push(o); });
  frames.forEach((m, i) => {
    m.visible = i === 0;
    // all primitives share material 0 in the .glb -- clone so they fade apart
    m.material = m.material.clone();
    m.material.vertexColors = true;
    m.material.side = THREE.DoubleSide;   // back-faces were stripped at build time
    m.material.flatShading = true;        // no NORMAL attribute: shade per face
    // Alpha blending rather than alphaHash dithering: the dither is grain-free of
    // ghosting but reads as crunchy up close. Blending trades that for a soft
    // double-exposure, which is the look we want here.
    m.material.alphaHash = false;
    m.material.transparent = CROSSFADE > 0;
    m.material.depthWrite = true;         // leaves must still self-occlude
    m.material.opacity = i === 0 ? 1 : 0;
    m.material.needsUpdate = true;
  });
  group.add(gltf.scene);

  // Frame the camera on the LAST step, so the view does not need to change as
  // the plant grows.
  frames.forEach(m => m.visible = true);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  frames.forEach((m,i) => m.visible = i === 0);
  const size = box.getSize(new THREE.Vector3());
  const mid  = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) || 0.05;
  camera.position.set(mid.x + span*1.6, mid.y + span*0.9, mid.z + span*1.9);
  camera.near = span/100; camera.far = span*200; camera.updateProjectionMatrix();
  controls.target.copy(mid); controls.update();

  $('scrub').max = frames.length - 1;
  show(0);

  if (navigator.xr) navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (!ok) return;
    const b = $('arbtn'); b.hidden = false;
    b.onclick = () => {
      // In AR the model sits at true scale (a few cm); lift and enlarge it so it
      // reads on a table in front of the user.
      group.scale.setScalar(4);
      group.position.set(0, 0, -0.5);
      document.body.appendChild(ARButton.createButton(renderer)).click();
    };
  });
}, undefined, e => {
  $('err').style.display = 'grid';
  $('errmsg').textContent = e?.message || String(e);
});

function show(i) {
  if (!frames.length) return;
  const next = (i + frames.length) % frames.length;
  if (next !== cur && CROSSFADE > 0) {
    if (prev >= 0 && prev !== cur) { frames[prev].visible = false; frames[prev].material.opacity = 0; }
    prev = cur; fade = 0;
    // A correct cross-dissolve fades ONE layer. Fading both means neither is
    // opaque, so the background shows through and the plant visibly dims
    // mid-transition (at t=0.5 you get 0.5*out + 0.25*in over black).
    // So: the outgoing frame stays fully opaque underneath and owns the depth
    // buffer; the incoming one fades in on top of it, giving exactly
    // t*in + (1-t)*out.
    frames[prev].material.opacity = 1;
    frames[prev].material.depthWrite = true;
    frames[prev].renderOrder = 0;
    frames[next].material.depthWrite = false;   // must not occlude before it shows
    frames[next].renderOrder = 1;
    frames[prev].visible = true;
    frames[next].visible = true;
    frames[next].material.opacity = 0;
  } else if (next !== cur) {
    frames[cur].visible = false;
    frames[next].material.opacity = 1;
  }
  cur = next;
  frames[cur].visible = true;
  $('scrub').value = cur;
  $('frameNo').textContent = (cur+1) + '/' + frames.length;
  $('frameName').textContent = meta?.frames?.[cur] ?? '';
  const h = meta?.heights_m?.[cur];
  $('hgt').textContent = h ? (h*100).toFixed(1) + ' cm tall' : '';
}

$('play').onclick  = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
$('scrub').oninput = e => { playing = false; $('play').textContent = 'Play'; show(+e.target.value); };
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = (now - last)/1000; last = now;
  if (frames.length && prev >= 0) {
    fade += dt;
    const t = Math.min(1, fade / CROSSFADE);
    frames[cur].material.opacity = t;      // outgoing stays at 1 underneath
    if (t >= 1) {
      frames[prev].visible = false;
      frames[cur].material.depthWrite = true;
      prev = -1;
    }
  }
  if (playing && frames.length) { acc += dt; if (acc >= 1/FPS) { acc = 0; show(cur+1); } }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
